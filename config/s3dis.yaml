DATA:
  data_name: s3dis
  data_root: 
  test_area: 5
  classes: 13
  fea_dim: 6
  voxel_size: 0.04
  voxel_max: 50000
  loop: 20

TRAIN:
  arch: weak
  use_xyz: True
  sync_bn: False
  ignore_label: 255
  train_gpu: [0]
  workers: 16
  batch_size: 4
  batch_size_val: 2
  base_lr: 0.0005
  epochs: 100
  start_epoch: 0
  step_epoch: 50
  multiplier: 0.1
  momentum: 0.9
  weight_decay: 0.1
  drop_rate: 0.5
  manual_seed: 42 #7777
  print_freq: 25
  save_freq: 1
  save_path: saved_models/s3dis
  weight: None
  resume: None
  evaluate: True
  eval_freq: 1
  labeled_point: 0.01%

Distributed:
  dist_url: tcp://localhost:8888
  dist_backend: 'nccl'
  multiprocessing_distributed: False
  world_size: 1
  rank: 0

TEST:
  test_list: val5.txt
  test_list_full: val5_full.txt
  split: val
  test_gpu: [0]
  test_workers: 4
  batch_size_test: 4
  model_path: saved_models/s3dis/model/model_best.pth
  save_folder: results/s3dis/test
  names_path: /media/dell/wcjdata/data/stanford_indoor3d/s3dis_names.txt

